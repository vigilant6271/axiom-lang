[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-lang-prototype"
version = "0.1.0"
description = "Experimental Axiom language and adaptive runtime prototypes"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[project.scripts]
axiom = "axiom.__main__:main"

[tool.setuptools]
packages = ["axiom"]
